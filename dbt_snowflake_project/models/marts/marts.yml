version: 2

models:
  - name: fct_orders
    description: "Fact table with orders, needed to create to get info in data mart"
    columns:
      - name: order_id
        description: "Column with order_id"
        data_tests:
          - not_null
      - name: customer_id
        description: "Foreign key to table customers"
        data_tests:
          - not_null
      - name: order_line_id
        description: "Primary key, unique business key (order_id '|' + line_id)"
        data_tests:
          - unique
          - not_null
      - name: product_id
        description: "Foreign key to table products"
        data_tests:
          - not_null
  - name: dim_product 
    description: "Dimension table for product"
    columns:
      - name: product_id
        description: "Business key for primary key"
        data_tests:
          - not_null
      - name: retail_price
        description: "Retail price of product"
        data_tests:
          - not_null
          - not_negative:
              min_value: 0
          - is_greater_than:
              lesser_column_name: supplier_price
      - name: supplier_price
        description: "Supplier price of product"
        data_tests:
          - not_null
          - not_negative:
              min_value: 0